name: focus_app
description: A productivity app inspired by the Focus web app.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  fl_chart: ^0.66.0
  intl: ^0.20.2
  just_audio: ^0.9.36
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  file_selector: ^1.0.0
  file_picker: ^8.1.2
  crypto: ^3.0.6
  archive: ^3.6.1
  excel: ^4.0.6
  xml: ^6.5.0
  pdf: ^3.10.7
  printing: ^5.11.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.13.1
  http: ^1.3.0
  home_widget: ^0.9.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  lucide_icons_flutter: ^3.1.14+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/illustrations/focus_mascot.png
    - assets/medals/gold.png
    - assets/medals/silver.png
    - assets/medals/bronze.png
    - assets/metrics/focus_points.png
    - android/app/src/main/res/drawable-nodpi/focus_streak_fire.png
    - assets/profile_icons/
    - assets/badges/
    - assets/sounds/chime.mp3
    - assets/sounds/bell.mp3
    - assets/sounds/success.mp3
    - assets/sounds/soft_bell.mp3
    - assets/sounds/digital.mp3
    - assets/sounds/magic.mp3
    - assets/sounds/confirm.mp3
    - assets/sounds/fomodoro_clock.mp3
    - assets/sounds/clock_tick.mp3
    - assets/sounds/ambient/
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
